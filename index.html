<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWE Ball Kitty</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--ink:#1c2420;--mute:#6b766f;--line:#e2e6e0;--acc:#1f7a4d;--warn:#b7791f;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--card:#1a211d;--ink:#e8eee9;--mute:#98a39b;--line:#2a332d;--acc:#4cc38a;--warn:#e0a84a;--bad:#ef6b5b}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
.sub,.mute{color:var(--mute);font-size:14px;margin:0 0 6px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tot span{display:block;font-size:11px;color:var(--mute)}.tot b{font-size:18px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:var(--bg);padding:8px 0;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font-size:14px;padding:9px 6px}
.tabs button.on,.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:13px;padding:6px 10px;border-radius:999px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row.warn{border-color:var(--warn)}.row.bad{border-color:var(--bad)}.row.tap{cursor:pointer}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}.nm small{display:block;color:var(--mute);font-size:12px}
.warn .nm small{color:var(--warn)}.bad .nm small{color:var(--bad)}
.bl{font-weight:700;font-size:17px}.neg{color:var(--bad)}.pos{color:var(--acc)}
.detail{margin:-2px 0 8px 10px;padding-left:10px;border-left:3px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.sm{font-size:13px;padding:6px 10px}button.x{padding:3px 8px;color:var(--mute)}
button.main{width:100%;background:var(--acc);color:#fff;border:0;padding:12px;font-weight:600;margin-top:8px}
button.pick{display:flex;justify-content:space-between;width:100%;margin-bottom:6px;text-align:left}
button:disabled{opacity:.45}
.step{display:flex;align-items:center;gap:10px}.step button{width:40px;height:40px;font-size:20px;padding:0}.step b{min-width:18px;text-align:center}
input{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
.foot{margin-top:28px;text-align:center}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}.sum b{font-size:16px}
</style></head>
<body><div id="app"><p class="mute">Loading…</p></div>
<script>
const KITTY=100,BALL=70,LIMIT=-Infinity,PAGE=30;
let S={players:[],log:[]},draft={},err='',busy=false;
let tab='players',q='',flt='all',shown=PAGE,openId=null,selD=null,ps='';
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let pd=today();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>(n<0?'−':'')+'₹'+Math.abs(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const balIn=(d,id)=>d.log.filter(e=>e.p===id).reduce((a,e)=>a+e.a,0);
const bal=id=>balIn(S,id);
const nameOf=id=>(S.players.find(p=>p.id===id)||{name:'?'}).name;
const canEdit=()=>!!(ls.g('kt')&&repo());
function calc(){const B={};S.players.forEach(p=>B[p.id]=0);S.log.forEach(e=>{B[e.p]=(B[e.p]||0)+e.a});return B;}

function repo(){
  const r=ls.g('kr');if(r)return r;
  const m=location.hostname.match(/^(.+)\.github\.io$/),p=location.pathname.split('/')[1];
  return(m&&p)?m[1]+'/'+p:null;
}
async function load(){
  const R=repo(),T=ls.g('kt');
  if(R){
    try{
      const h={Accept:'application/vnd.github.raw+json'};if(T)h.Authorization='Bearer '+T;
      const r=await fetch('https://api.github.com/repos/'+R+'/contents/data.json?t='+Date.now(),{headers:h,cache:'no-store'});
      if(r.ok){S=await r.json();return;}
    }catch(e){}
  }
  try{const r=await fetch('data.json?t='+Date.now());S=await r.json();}catch(e){err='Could not load data.';}
}
async function mutate(fn){
  const R=repo(),T=ls.g('kt');
  if(!R||!T)throw new Error('Editor login needed.');
  const H={Authorization:'Bearer '+T,Accept:'application/vnd.github+json'};
  const u='https://api.github.com/repos/'+R+'/contents/data.json';
  const g=await fetch(u+'?t='+Date.now(),{headers:H,cache:'no-store'});
  if(!g.ok)throw new Error(g.status===401?'Token invalid or expired.':g.status===404?'Repo or data.json not found, or token has no access.':'GitHub error '+g.status);
  const j=await g.json();
  if(Array.isArray(j)||!j.sha)throw new Error('Unexpected reply from GitHub. Refresh and try again.');
  let txt;
  if(typeof j.content==='string'&&j.content.length&&j.encoding==='base64'){
    txt=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
  }else{
    const rr=await fetch(u+'?t='+Date.now(),{headers:{Authorization:'Bearer '+T,Accept:'application/vnd.github.raw+json'},cache:'no-store'});
    txt=rr.ok?await rr.text():'';
  }
  let cur;try{cur=JSON.parse(txt);}catch(e){cur=null;}
  if(!cur||!Array.isArray(cur.players)||!Array.isArray(cur.log))cur={players:[],log:[]};
  fn(cur);
  const body={message:'Update kitty',content:btoa(unescape(encodeURIComponent(JSON.stringify(cur,null,1)))),sha:j.sha};
  const p=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify(body)});
  if(!p.ok)throw new Error(p.status===409?'Someone else saved at the same time. Try again.':(p.status===403||p.status===401||p.status===404)?'Token cannot write. Needs Contents: read and write on this repo.':'Save failed ('+p.status+')');
  S=cur;
}
async function run(fn,after){
  busy=true;err='';render();
  try{await mutate(fn);if(after)after();}catch(e){err=e.message||'Error';}
  busy=false;render();
}

function openBalls(){
  return S.log.filter(e=>e.k==='ball').map(e=>{
    const got=S.log.filter(f=>f.k==='found'&&f.ref===e.i).reduce((x,f)=>x+f.n,0);
    return{e,got,left:e.n-got};
  }).filter(x=>x.left>0).sort((a,b)=>b.e.t-a.e.t);
}
function entryRow(e,ed,showName){
  const txt=e.k==='ball'?`${e.n} ball${e.n>1?'s':''} lost`:e.k==='found'?`${e.n} ball${e.n>1?'s':''} found, ${rs(e.a)} refunded`:e.k==='top'?'Top-up':'Joined';
  return `<div class="hrow"><div class="nm">${showName?esc(nameOf(e.p))+' · ':''}${txt}<small>${e.d}</small></div><div class="bl ${e.a<0?'neg':'pos'}">${e.a<0?'−':'+'}₹${Math.abs(e.a)}</div>${ed&&e.k!=='join'?`<button class="x" ${busy?'disabled':''} data-a="del" data-i="${e.i}">✕</button>`:''}</div>`;
}
function playersHtml(){
  const B=calc(),ed=canEdit(),dis=busy?'disabled':'';
  let L=S.players.map(p=>({...p,b:B[p.id]||0}));
  const qq=q.trim().toLowerCase();
  if(qq)L=L.filter(p=>p.name.toLowerCase().includes(qq));
  if(flt==='due')L=L.filter(p=>p.b<=0);
  L.sort(flt==='due'?(a,b)=>a.b-b.b:(a,b)=>a.name.localeCompare(b.name));
  const total=L.length,lim=qq?total:shown;
  let h=`<p class="mute">${total} player${total==1?'':'s'}${flt==='due'?' needing a top-up':''}</p>`;
  if(!total)h+=`<p class="mute">${S.players.length?'No players match.':'No players yet.'}</p>`;
  L.slice(0,lim).forEach(p=>{
    const st=p.b<=LIMIT?'bad':p.b<=0?'warn':'';
    const tag=p.b<=LIMIT?'Top up now':p.b<=0?'Top up due':'';
    h+=`<div class="row tap ${st}" data-a="open" data-id="${p.id}"><div class="nm">${esc(p.name)}${tag?`<small>${tag}</small>`:''}</div><div class="bl ${p.b<0?'neg':''}">${rs(p.b)}</div><span class="mute">${openId===p.id?'▲':'▼'}</span></div>`;
    if(openId===p.id){
      const E=S.log.filter(e=>e.p===p.id).sort((a,b)=>b.t-a.t);
      h+='<div class="detail">';
      if(ed)h+=`<button class="sm" ${dis} data-a="top" data-id="${p.id}">Add payment</button>`;
      E.forEach(e=>h+=entryRow(e,ed,false));
      h+='</div>';
    }
  });
  if(total>lim)h+=`<button class="main" data-a="more">Show more (${total-lim} left)</button>`;
  return h;
}
function pickHtml(){
  const qq=ps.trim().toLowerCase();
  if(!qq)return '<p class="mute">Type a name to find a player.</p>';
  const B=calc();
  const M=S.players.filter(p=>!draft[p.id]&&p.name.toLowerCase().includes(qq)).slice(0,8);
  if(!M.length)return '<p class="mute">No match.</p>';
  return M.map(p=>`<button class="pick" data-a="pick" data-id="${p.id}"><span>${esc(p.name)}</span><span class="mute">${rs(B[p.id]||0)}</span></button>`).join('');
}
function daysHtml(){
  const ed=canEdit();
  const dates=[...new Set(S.log.map(e=>e.d))].sort().reverse();
  if(!selD)selD=S.log.filter(e=>e.k==='ball').map(e=>e.d).sort().pop()||dates[0]||today();
  let h=`<input type="date" id="sd" value="${selD}">`;
  if(dates.length){h+='<div class="chips">';dates.slice(0,8).forEach(d=>{h+=`<button class="chip ${d===selD?'on':''}" data-a="day" data-d="${d}">${d.slice(5)}</button>`;});h+='</div>';}
  const E=S.log.filter(e=>e.d===selD);
  const ord={ball:0,found:1,top:2,join:3};
  E.sort((a,b)=>ord[a.k]-ord[b.k]||b.t-a.t);
  const lost=E.filter(e=>e.k==='ball').reduce((a,e)=>a+e.n,0);
  const fnd=E.filter(e=>e.k==='found').reduce((a,e)=>a+e.n,0);
  const paid=E.filter(e=>e.k==='top'||e.k==='join').reduce((a,e)=>a+e.a,0);
  if(!E.length)return h+'<p class="mute">Nothing was recorded on this day.</p>';
  h+=`<div class="sum"><span><b>${lost}</b> balls lost</span><span><b>${fnd}</b> found</span><span><b>${rs(paid)}</b> paid in</span></div>`;
  E.forEach(e=>h+=entryRow(e,ed,true));
  return h;
}
function lostHtml(){
  const ed=canEdit(),O=openBalls();
  if(!O.length)return '<p class="mute">No lost balls outstanding.</p>';
  return O.map(x=>`<div class="row"><div class="nm">${esc(nameOf(x.e.p))}<small>${x.e.n} lost on ${x.e.d} · ${x.got} found · ${x.left} still missing</small></div>${ed?`<button class="sm" ${busy?'disabled':''} data-a="found" data-i="${x.e.i}">Ball found</button>`:''}</div>`).join('');
}
function editHtml(){
  const dis=busy?'disabled':'';
  let h=`<h2>Record a play day</h2><input type="date" id="dt" value="${pd}"><input id="ps" placeholder="Search player who lost a ball…" value="${esc(ps)}" autocomplete="off"><div id="pk">${pickHtml()}</div>`;
  const ids=Object.keys(draft);
  if(ids.length){
    h+='<h2>Balls lost this day</h2>';
    ids.forEach(id=>{const n=draft[id];h+=`<div class="row"><div class="nm">${esc(nameOf(id))}<small>→ ${rs(bal(id)-n*BALL)}</small></div><div class="step"><button ${dis} data-a="dec" data-id="${id}">−</button><b>${n}</b><button ${dis} data-a="inc" data-id="${id}">+</button></div></div>`;});
    const tb=ids.reduce((a,id)=>a+draft[id],0);
    h+=`<button class="main" ${busy?'disabled':''} data-a="saveday">${busy?'Saving…':`Save day · ${tb} ball${tb==1?'':'s'} · ${rs(tb*BALL)}`}</button>`;
  }
  h+=`<h2>Add player</h2><input id="nn" placeholder="Player name" maxlength="30"><input id="na" type="number" inputmode="numeric" min="${KITTY}" value="${KITTY}" placeholder="Amount paid (minimum ${rs(KITTY)})"><button class="main" ${dis} data-a="add" style="margin-top:0">Add player</button>`;
  return h;
}

function render(){
  const nn=document.getElementById('nn');const nnv=nn?nn.value:'';
  const ed=canEdit();
  if(tab==='edit'&&!ed)tab='players';
  const col=S.log.filter(e=>e.k==='join'||e.k==='top').reduce((a,e)=>a+e.a,0);
  const used=-S.log.filter(e=>e.k==='ball'||e.k==='found').reduce((a,e)=>a+e.a,0);
  const balls=S.log.filter(e=>e.k==='ball').reduce((a,e)=>a+e.n,0)-S.log.filter(e=>e.k==='found').reduce((a,e)=>a+e.n,0);
  const nOpen=openBalls().reduce((a,x)=>a+x.left,0);
  let h=`<h1>🏏 SWE Ball Kitty</h1><p class="sub">Pay in ${rs(KITTY)} or more · ${rs(BALL)} per lost ball</p>`;
  h+=`<div class="tot"><div><span>Collected</span><b>${rs(col)}</b></div><div><span>Used (${balls} balls)</span><b>${rs(used)}</b></div><div><span>Remaining</span><b>${rs(col-used)}</b></div></div>`;
  const T=[['players','Players'],['days','By day'],['lost','Lost ('+nOpen+')']];if(ed)T.push(['edit','Edit']);
  h+='<div class="tabs">'+T.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('')+'</div>';
  if(tab==='players'){
    h+=`<input id="q" placeholder="Search name…" value="${esc(q)}" autocomplete="off"><div class="chips"><button class="chip ${flt==='all'?'on':''}" data-a="flt" data-f="all">All</button><button class="chip ${flt==='due'?'on':''}" data-a="flt" data-f="due">Top-up due</button></div><div id="lst">${playersHtml()}</div>`;
  }else if(tab==='days')h+=daysHtml();
  else if(tab==='lost')h+=lostHtml();
  else if(tab==='edit')h+=editHtml();
  if(err)h+=`<p class="err">${esc(err)}</p>`;
  h+=`<div class="foot">${ed?'<button class="sm" data-a="logout">Log out of editing</button>':'<button class="sm" data-a="login">Editor login</button>'}</div>`;
  document.getElementById('app').innerHTML=h;
  const n2=document.getElementById('nn');if(n2)n2.value=nnv;
}

const app=document.getElementById('app');
app.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='q'){q=ev.target.value;shown=PAGE;document.getElementById('lst').innerHTML=playersHtml();}
  else if(id==='ps'){ps=ev.target.value;document.getElementById('pk').innerHTML=pickHtml();}
});
app.addEventListener('change',ev=>{
  if(ev.target.id==='dt')pd=ev.target.value;
  if(ev.target.id==='sd'){selD=ev.target.value;render();}
});
app.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||busy)return;
  const a=b.dataset.a,id=b.dataset.id;err='';
  if(a==='tab'){tab=b.dataset.t;render();return;}
  if(a==='flt'){flt=b.dataset.f;shown=PAGE;render();return;}
  if(a==='more'){shown+=PAGE;render();return;}
  if(a==='open'){openId=openId===id?null:id;render();return;}
  if(a==='day'){selD=b.dataset.d;render();return;}
  if(a==='login'){
    let R=repo();
    if(!R){R=(prompt('GitHub repo (format: username/reponame)')||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');if(!R)return;}
    const T=(prompt('Paste your GitHub access token')||'').trim();if(!T)return;
    try{
      const r=await fetch('https://api.github.com/repos/'+R,{headers:{Authorization:'Bearer '+T},cache:'no-store'});
      if(!r.ok)throw 0;
      const j=await r.json();
      if(j.permissions&&!j.permissions.push)throw 1;
      ls.s('kr',R);ls.s('kt',T);
    }catch(e){err=e===1?'That token cannot write to this repo.':'Could not verify token or repo.';}
    render();return;
  }
  if(a==='logout'){ls.d('kt');draft={};render();return;}
  if(a==='pick'){
    if(bal(id)-BALL<LIMIT)err=nameOf(id)+' would go below '+rs(LIMIT)+'. Top up first.';
    else{draft[id]=1;ps='';}
    render();return;
  }
  if(a==='inc'){const n=(draft[id]||0)+1;if(bal(id)-n*BALL<LIMIT)err=nameOf(id)+' would go below '+rs(LIMIT)+'. Top up first.';else draft[id]=n;render();return;}
  if(a==='dec'){if(draft[id]){draft[id]--;if(!draft[id])delete draft[id];}render();return;}
  if(a==='add'){
    const v=document.getElementById('nn').value.trim();
    if(!v){err='Enter a name.';render();return;}
    const amt=parseInt(document.getElementById('na').value,10);
    if(!(amt>=KITTY)){err='Amount paid must be at least '+rs(KITTY)+'.';render();return;}
    run(d=>{
      if(d.players.some(p=>p.name.toLowerCase()===v.toLowerCase()))throw new Error('That name already exists.');
      const pid=uid();d.players.push({id:pid,name:v});
      d.log.push({i:uid(),t:Date.now(),d:today(),p:pid,k:'join',a:amt,n:0});
    },()=>{const x=document.getElementById('nn');if(x)x.value='';});
    return;
  }
  if(a==='top'){
    const def=Math.max(KITTY,KITTY-bal(id));
    const ans=prompt('Amount paid by '+nameOf(id)+' (minimum '+rs(KITTY)+')',String(def));
    if(ans===null)return;
    const amt=parseInt(ans,10);
    if(!(amt>=KITTY)){err='Amount paid must be at least '+rs(KITTY)+'.';render();return;}
    run(d=>{d.log.push({i:uid(),t:Date.now(),d:today(),p:id,k:'top',a:amt,n:0});});
    return;
  }
  if(a==='saveday'){
    const dd=pd,dr={...draft};
    run(d=>{
      let t=Date.now();
      Object.keys(dr).forEach(pid=>{
        if(balIn(d,pid)-dr[pid]*BALL<LIMIT)throw new Error('A player would go below '+rs(LIMIT)+'. Top up first.');
        d.log.push({i:uid(),t:t++,d:dd,p:pid,k:'ball',a:-dr[pid]*BALL,n:dr[pid]});
      });
    },()=>{draft={};selD=dd;});
    return;
  }
  if(a==='found'){
    const i=b.dataset.i;
    const le=S.log.find(x=>x.i===i);if(!le)return;
    const lg=S.log.filter(f=>f.k==='found'&&f.ref===i).reduce((z,f)=>z+f.n,0);
    const mx=le.n-lg;
    const ans=prompt('How many balls were found? (1 to '+mx+')',String(mx));
    if(ans===null)return;
    const c=parseInt(ans,10);
    if(!(c>=1&&c<=mx)){err='Enter a number from 1 to '+mx+'.';render();return;}
    run(d=>{
      const e=d.log.find(x=>x.i===i);if(!e)throw new Error('Entry not found.');
      const got=d.log.filter(f=>f.k==='found'&&f.ref===i).reduce((z,f)=>z+f.n,0);
      if(c>e.n-got)throw new Error('Only '+(e.n-got)+' ball(s) are still missing.');
      d.log.push({i:uid(),t:Date.now(),d:today(),p:e.p,k:'found',a:c*BALL,n:c,ref:i});
    });
    return;
  }
  if(a==='del'){if(confirm('Delete this entry?')){const i=b.dataset.i;run(d=>{d.log=d.log.filter(e=>e.i!==i&&e.ref!==i);});}}
});
load().then(render);
</script></body></html>
